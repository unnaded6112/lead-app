<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0a0a14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated gradient background */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(79,70,229,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(124,58,237,0.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 60% 80%, rgba(14,165,233,0.08) 0%, transparent 60%);
      animation: bgShift 8s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      from { opacity: 0.8; }
      to   { opacity: 1; }
    }

    /* Grid lines */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }

    /* Floating particles canvas */
    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* Glowing blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      pointer-events: none;
    }
    .blob-1 { width:550px;height:550px;background:#4f46e5;top:-150px;left:-120px;animation:drift1 10s ease-in-out infinite alternate; }
    .blob-2 { width:450px;height:450px;background:#7c3aed;bottom:-120px;right:-100px;animation:drift2 13s ease-in-out infinite alternate; }
    .blob-3 { width:350px;height:350px;background:#0ea5e9;bottom:80px;left:80px;animation:drift1 16s ease-in-out infinite alternate; }
    @keyframes drift1 { from{transform:translate(0,0)} to{transform:translate(50px,35px)} }
    @keyframes drift2 { from{transform:translate(0,0)} to{transform:translate(-50px,-35px)} }

    /* Card */
    .card {
      position: relative;
      text-align: center;
      padding: 56px 52px 48px;
      background: rgba(255,255,255,0.04);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      max-width: 500px;
      width: 92%;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) both;
      z-index: 10;
    }

    /* Animated glowing border */
    .card::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: 29px;
      background: linear-gradient(130deg, rgba(79,70,229,0.8), rgba(124,58,237,0.4), rgba(14,165,233,0.6), rgba(79,70,229,0.8));
      background-size: 300% 300%;
      animation: borderSpin 4s linear infinite;
      z-index: -1;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      padding: 1.5px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
    }
    @keyframes borderSpin {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(40px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* Icon with orbit ring */
    .icon-wrap {
      position: relative;
      width: 80px; height: 80px;
      margin: 0 auto 32px;
    }

    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 40px rgba(79,70,229,0.5), 0 8px 32px rgba(79,70,229,0.3);
      animation: iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%,100% { box-shadow: 0 0 40px rgba(79,70,229,0.5), 0 8px 32px rgba(79,70,229,0.3); }
      50%      { box-shadow: 0 0 60px rgba(79,70,229,0.8), 0 8px 40px rgba(124,58,237,0.5); }
    }

    /* Orbit dot */
    .orbit {
      position: absolute;
      inset: -14px;
      border: 1.5px dashed rgba(79,70,229,0.4);
      border-radius: 50%;
      animation: spin 6s linear infinite;
    }
    .orbit::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      background: #7c3aed;
      border-radius: 50%;
      top: -4px; left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 8px #7c3aed;
    }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 40%, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.93rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    /* Stats row */
    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 36px;
    }
    .stat {
      text-align: center;
    }
    .stat .num {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      display: block;
    }
    .stat .lbl {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .stat-divider {
      width: 1px;
      background: rgba(255,255,255,0.1);
      align-self: stretch;
    }

    /* Feature badges */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 36px;
    }
    .badge {
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }
    .badge:nth-child(1) { animation-delay: 0.2s; }
    .badge:nth-child(2) { animation-delay: 0.3s; }
    .badge:nth-child(3) { animation-delay: 0.4s; }
    .badge:nth-child(4) { animation-delay: 0.5s; }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4f46e5;
      box-shadow: 0 0 6px #4f46e5;
    }

    /* Enter button */
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 44px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(79,70,229,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.2px;
      animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.3s both;
    }
    .enter-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 40px rgba(79,70,229,0.65);
    }
    .enter-btn:active { transform: translateY(0); }

    .arrow {
      display: inline-block;
      transition: transform 0.2s;
    }
    .enter-btn:hover .arrow { transform: translateX(4px); }

    .tagline {
      margin-top: 24px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Transition overlay */
    .transition-overlay {
      position: fixed;
      inset: 0;
      background: #0a0a14;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }
    .transition-overlay.active { opacity: 1; pointer-events: all; }

    /* Card exit animation */
    .card.exiting {
      animation: cardExit 0.5s cubic-bezier(0.4,0,1,1) forwards;
    }
    @keyframes cardExit {
      from { opacity:1; transform: translateY(0) scale(1); }
      to   { opacity:0; transform: translateY(-20px) scale(0.97); }
    }
  </style>
</head>
<body>

<div class="transition-overlay" id="overlay"></div>
<div class="bg-gradient"></div>
<div class="grid"></div>
<canvas id="particles"></canvas>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="card">

  <div class="icon-wrap">
    <div class="icon">&#128202;</div>
    <div class="orbit"></div>
  </div>

  <h1>Lead Tracker</h1>
  <p class="subtitle">Capture, manage and follow up with your leads<br>all from one clean dashboard.</p>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span class="num" id="c1">0</span>
      <span class="lbl">Leads Stored</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="num">AI</span>
      <span class="lbl">Email Drafts</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="num">CSV</span>
      <span class="lbl">Export Ready</span>
    </div>
  </div>

  <!-- Feature badges -->
  <div class="badges">
    <span class="badge"><span class="badge-dot"></span>Add &amp; Edit Leads</span>
    <span class="badge"><span class="badge-dot"></span>Status Tracking</span>
    <span class="badge"><span class="badge-dot"></span>AI Email Drafts</span>
    <span class="badge"><span class="badge-dot"></span>Export to Excel</span>
  </div>

  <a class="enter-btn" href="/dashboard" id="enterBtn" onclick="enterApp(event)">
    Enter Lead Tracker <span class="arrow">&#8594;</span>
  </a>

  <p class="tagline">Your leads. Your pipeline.</p>

</div>

<script>
  // ── Floating particles ────────────────────────────────
  const canvas = document.getElementById("particles");
  const ctx    = canvas.getContext("2d");

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  const particles = Array.from({ length: 60 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.5,
    dx: (Math.random() - 0.5) * 0.3,
    dy: -Math.random() * 0.4 - 0.1,
    alpha: Math.random() * 0.5 + 0.1,
  }));

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(130,100,255,${p.alpha})`;
      ctx.fill();
      p.x += p.dx;
      p.y += p.dy;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // ── Animated lead counter ─────────────────────────────
  fetch("/api/leads")
    .then(r => r.json())
    .then(leads => {
      const target = leads.length;
      if (target === 0) { document.getElementById("c1").textContent = "0"; return; }
      let count = 0;
      const step = Math.ceil(target / 30);
      const timer = setInterval(() => {
        count = Math.min(count + step, target);
        document.getElementById("c1").textContent = count;
        if (count >= target) clearInterval(timer);
      }, 40);
    })
    .catch(() => {});

  // ── Page transition ───────────────────────────────────
  function enterApp(e) {
    e.preventDefault();
    document.querySelector(".card").classList.add("exiting");
    setTimeout(() => {
      document.getElementById("overlay").classList.add("active");
    }, 250);
    setTimeout(() => {
      window.location.href = "/dashboard";
    }, 750);
  }
</script>

</body>
</html>
