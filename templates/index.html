<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0c0c1e;
      color: #e2e2f0;
      animation: pageFadeIn 0.6s ease both;
      min-height: 100vh;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Background blobs */
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0.12; pointer-events: none; z-index: 0;
    }
    .blob-1 { width:500px;height:500px;background:#4f46e5;top:-150px;left:-100px;animation:drift1 12s ease-in-out infinite alternate; }
    .blob-2 { width:400px;height:400px;background:#7c3aed;bottom:-100px;right:-80px;animation:drift2 14s ease-in-out infinite alternate; }
    @keyframes drift1 { from{transform:translate(0,0)} to{transform:translate(40px,30px)} }
    @keyframes drift2 { from{transform:translate(0,0)} to{transform:translate(-40px,-30px)} }

    header {
      background: rgba(15,15,30,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      color: white; padding: 16px 32px;
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }

    .container { max-width: 1150px; margin: 32px auto; padding: 0 24px; position: relative; z-index: 1; }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
      backdrop-filter: blur(8px);
    }

    /* Stats */
    .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat {
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 14px 20px;
      flex: 1; min-width: 120px; text-align: center; cursor: pointer;
      transition: border-color 0.2s; backdrop-filter: blur(8px);
    }
    .stat.active  { border-color: #4f46e5; box-shadow: 0 0 16px rgba(79,70,229,0.2); }
    .stat .num    { font-size: 1.8rem; font-weight: 700; color: #818cf8; }
    .stat .label  { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 2px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .toolbar input {
      flex: 1; min-width: 200px; padding: 9px 14px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 0.9rem; outline: none;
      color: white; font-family: inherit;
    }
    .toolbar input::placeholder { color: rgba(255,255,255,0.3); }
    .toolbar input:focus { border-color: #4f46e5; }

    /* Filter pills */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-btn {
      padding: 6px 16px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s; color: rgba(255,255,255,0.55);
    }
    .filter-btn:hover  { border-color: #4f46e5; color: #818cf8; }
    .filter-btn.active { background: #4f46e5; border-color: #4f46e5; color: white; }

    /* Buttons */
    .btn {
      padding: 9px 18px; border: none; border-radius: 8px;
      font-size: 0.88rem; cursor: pointer; font-weight: 500;
      transition: opacity 0.2s; white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-export  { background: #059669; color: white; }
    .btn-cancel  { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.1); }
    .btn-danger  { background: #ef4444; color: white; padding: 5px 12px; font-size: 0.8rem; }
    .btn-edit    { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); padding: 5px 12px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1); }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th {
      text-align: left; padding: 11px 13px;
      background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5); font-weight: 600; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody td { padding: 11px 13px; vertical-align: middle; color: #e2e2f0; }

    /* Status dropdown */
    .status-select {
      padding: 2px 10px; border-radius: 999px; border: none;
      font-size: 0.78rem; font-weight: 700; cursor: pointer; outline: none;
    }
    .status-New        { background: rgba(99,102,241,0.2);  color: #a5b4fc; }
    .status-Contacted  { background: rgba(245,158,11,0.2);  color: #fcd34d; }
    .status-Qualified  { background: rgba(16,185,129,0.2);  color: #6ee7b7; }
    .status-Lost       { background: rgba(239,68,68,0.2);   color: #fca5a5; }

    .actions { display: flex; gap: 6px; }
    .empty { text-align: center; padding: 48px; color: rgba(255,255,255,0.3); font-size: 0.95rem; }

    /* Modal */
    .modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #13132a; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 28px;
      width: 100%; max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .modal h2 { margin-bottom: 18px; font-size: 1.1rem; color: white; }
    .modal label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: rgba(255,255,255,0.5); margin-bottom: 4px; margin-top: 12px;
    }
    .modal input, .modal textarea, .modal select {
      width: 100%; padding: 10px 12px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 0.9rem; outline: none;
      font-family: inherit; color: white; transition: border 0.2s;
    }
    .modal input::placeholder, .modal textarea::placeholder { color: rgba(255,255,255,0.3); }
    .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: #4f46e5; }
    .modal select option { background: #13132a; }
    .modal textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a3a; border: 1px solid rgba(255,255,255,0.1);
      color: white; padding: 12px 20px; border-radius: 10px;
      font-size: 0.88rem; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 999; display: flex; align-items: center; gap: 12px;
    }
    #toast.show { opacity: 1; pointer-events: auto; }
    #undoBtn {
      background: #4f46e5; border: none; color: white;
      padding: 4px 12px; border-radius: 6px;
      font-size: 0.82rem; cursor: pointer; font-weight: 600;
    }

    /* Draft email panel */
    .email-panel-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 200;
      align-items: center; justify-content: center;
    }
    .email-panel-bg.open { display: flex; }
    .email-panel {
      background: #13132a; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 28px;
      width: 100%; max-width: 560px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .email-panel h2 { font-size: 1.1rem; margin-bottom: 6px; color: white; }
    .email-panel .subtext { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-bottom: 16px; }
    .email-box {
      width: 100%; min-height: 200px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 14px; font-size: 0.9rem;
      font-family: inherit; line-height: 1.6; resize: vertical; outline: none;
      color: white;
    }
    .email-box:focus { border-color: #4f46e5; }
    .email-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; flex-wrap: wrap; }
    .btn-draft { background: #7c3aed; color: white; padding: 5px 12px; font-size: 0.8rem; }
    .btn-score { background: #0369a1; color: white; padding: 5px 12px; font-size: 0.8rem; }

    /* Score panel */
    .score-panel-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 200;
      align-items: center; justify-content: center;
    }
    .score-panel-bg.open { display: flex; }
    .score-panel {
      background: #13132a; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 32px;
      width: 100%; max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5); text-align: center;
    }
    .score-label { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 12px; }
    .score-hot  { color: #f87171; }
    .score-warm { color: #fbbf24; }
    .score-cold { color: #60a5fa; }
    .score-icon { font-size: 2.8rem; margin-bottom: 10px; }
    .score-reason {
      font-size: 0.95rem; color: rgba(255,255,255,0.7);
      line-height: 1.6; margin-bottom: 24px;
      background: rgba(255,255,255,0.06); border-radius: 10px; padding: 14px 16px;
    }
    .score-generating { color: rgba(255,255,255,0.4); font-style: italic; padding: 24px 0; }
    .generating { color: rgba(255,255,255,0.4); font-style: italic; padding: 16px 0; text-align: center; }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<header>
  <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;filter:drop-shadow(0 0 8px rgba(99,102,241,0.6))">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4f46e5"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
    </defs>
    <rect width="36" height="36" rx="10" fill="url(#lg)"/>
    <rect x="8"  y="22" width="5" height="7"  rx="1.5" fill="white" opacity="0.95"/>
    <rect x="16" y="16" width="5" height="13" rx="1.5" fill="white" opacity="0.95"/>
    <rect x="24" y="10" width="5" height="19" rx="1.5" fill="white" opacity="0.95"/>
  </svg>
  <h1>Lead Tracker</h1>
</header>

<div class="container">

  <!-- Stats -->
  <div class="stats">
    <div class="stat active" id="stat-all" onclick="setFilter('All')">
      <div class="num" id="count-all">0</div><div class="label">All Leads</div>
    </div>
    <div class="stat" id="stat-New" onclick="setFilter('New')">
      <div class="num" id="count-New">0</div><div class="label">New</div>
    </div>
    <div class="stat" id="stat-Contacted" onclick="setFilter('Contacted')">
      <div class="num" id="count-Contacted">0</div><div class="label">Contacted</div>
    </div>
    <div class="stat" id="stat-Qualified" onclick="setFilter('Qualified')">
      <div class="num" id="count-Qualified">0</div><div class="label">Qualified</div>
    </div>
    <div class="stat" id="stat-Lost" onclick="setFilter('Lost')">
      <div class="num" id="count-Lost">0</div><div class="label">Lost</div>
    </div>
  </div>

  <!-- Table card -->
  <div class="card">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openModal()">+ Add Lead</button>
      <button class="btn btn-export" onclick="exportCSV()">&#8595; Export to Excel</button>
      <input type="text" id="search" placeholder="Search by name, email, or source..." oninput="renderTable()" />
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('All')">All</button>
      <button class="filter-btn" onclick="setFilter('New')">New</button>
      <button class="filter-btn" onclick="setFilter('Contacted')">Contacted</button>
      <button class="filter-btn" onclick="setFilter('Qualified')">Qualified</button>
      <button class="filter-btn" onclick="setFilter('Lost')">Lost</button>
      <span style="width:1px;background:#e5e7eb;margin:0 4px;align-self:stretch;display:inline-block"></span>
      <button class="filter-btn" onclick="setDateFilter('today')">Today</button>
      <button class="filter-btn" onclick="setDateFilter('7')">Last 7 Days</button>
      <button class="filter-btn" onclick="setDateFilter('30')">Last 30 Days</button>
      <button class="filter-btn" onclick="setDateFilter('all')">All Time</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Source</th>
            <th>Status</th>
            <th>Date Added</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Add New Lead</h2>
    <form id="leadForm">
      <label>Full Name *</label>
      <input type="text" id="f-name" placeholder="e.g. Jane Smith" required />

      <label>Email</label>
      <input type="email" id="f-email" placeholder="e.g. jane@example.com" />

      <label>Phone</label>
      <input type="text" id="f-phone" placeholder="e.g. 07700 900000" />

      <label>Source</label>
      <input type="text" id="f-source" placeholder="e.g. Website, Referral, LinkedIn" />

      <label id="statusLabel" style="display:none">Status</label>
      <select id="f-status" style="display:none">
        <option value="New">New</option>
        <option value="Contacted">Contacted</option>
        <option value="Qualified">Qualified</option>
        <option value="Lost">Lost</option>
      </select>

      <label>Notes</label>
      <textarea id="f-notes" placeholder="Any extra details..."></textarea>

      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Add Lead</button>
      </div>
    </form>
  </div>
</div>

<!-- Score Panel -->
<div class="score-panel-bg" id="scorePanelBg">
  <div class="score-panel">
    <div id="scoreGenerating" class="score-generating">Analysing lead, please wait...</div>
    <div id="scoreResult" style="display:none">
      <div class="score-icon" id="scoreIcon"></div>
      <div class="score-label" id="scoreLabel"></div>
      <div class="score-reason" id="scoreReason"></div>
    </div>
    <button class="btn btn-cancel" style="width:100%" onclick="closeScorePanel()">Close</button>
  </div>
</div>

<!-- Draft Email Panel -->
<div class="email-panel-bg" id="emailPanelBg">
  <div class="email-panel">
    <h2>Draft Email</h2>
    <p class="subtext" id="emailSubtext">AI-generated draft for this lead — edit before sending.</p>
    <div id="emailGenerating" class="generating" style="display:none">Writing email, please wait...</div>
    <textarea class="email-box" id="emailBox" placeholder="Your draft will appear here..."></textarea>
    <div class="email-actions">
      <button class="btn btn-cancel" onclick="closeEmailPanel()">Close</button>
      <button class="btn btn-draft" onclick="regenerateEmail()">Regenerate</button>
      <button class="btn btn-primary" onclick="copyEmail()">Copy to Clipboard</button>
    </div>
  </div>
</div>

<!-- Toast with undo -->
<div id="toast">
  <span id="toastMsg"></span>
  <button id="undoBtn" style="display:none" onclick="undoDelete()">Undo</button>
</div>

<script>
  let allLeads      = [];
  let activeFilter  = "All";
  let activeDateFilter = "all";
  let editingId     = null;
  let pendingDelete = null;

  async function loadLeads() {
    const res = await fetch("/api/leads");
    allLeads = await res.json();
    updateStats();
    renderTable();
  }

  function updateStats() {
    document.getElementById("count-all").textContent = allLeads.length;
    ["New","Contacted","Qualified","Lost"].forEach(s => {
      document.getElementById("count-" + s).textContent =
        allLeads.filter(l => l.status === s).length;
    });
  }

  function setFilter(f) {
    activeFilter = f;
    ["all","New","Contacted","Qualified","Lost"].forEach(s => {
      const el = document.getElementById("stat-" + s);
      if (el) el.classList.toggle("active", s === f || (s === "all" && f === "All"));
    });
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.toggle("active", btn.textContent === f);
    });
    renderTable();
  }

  function setDateFilter(f) {
    activeDateFilter = f;
    document.querySelectorAll(".filter-btn").forEach(btn => {
      const map = { today:"Today", "7":"Last 7 Days", "30":"Last 30 Days", all:"All Time" };
      if (map[f]) btn.classList.toggle("active", btn.textContent === map[f]);
    });
    renderTable();
  }

  function renderTable() {
    const query = document.getElementById("search").value.toLowerCase();
    let list = allLeads;
    if (activeFilter !== "All") list = list.filter(l => l.status === activeFilter);

    // Date filter
    if (activeDateFilter !== "all") {
      const now = new Date();
      list = list.filter(l => {
        const added = new Date(l.created_at);
        if (activeDateFilter === "today") {
          return added.toDateString() === now.toDateString();
        }
        const days = parseInt(activeDateFilter);
        const cutoff = new Date(now);
        cutoff.setDate(cutoff.getDate() - days);
        return added >= cutoff;
      });
    }

    if (query) list = list.filter(l =>
      (l.name   || "").toLowerCase().includes(query) ||
      (l.email  || "").toLowerCase().includes(query) ||
      (l.source || "").toLowerCase().includes(query)
    );

    const tbody = document.getElementById("leadsBody");
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">No leads found.</div></td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(lead => `
      <tr>
        <td><a href="/lead/${lead.id}" style="color:#4f46e5;text-decoration:none;font-weight:600;">${esc(lead.name)}</a></td>
        <td>${esc(lead.email)}</td>
        <td>${esc(lead.phone)}</td>
        <td>${esc(lead.source)}</td>
        <td>
          <select class="status-select status-${lead.status}"
                  onchange="changeStatus(${lead.id}, this)">
            <option ${lead.status==='New'       ? 'selected' : ''}>New</option>
            <option ${lead.status==='Contacted' ? 'selected' : ''}>Contacted</option>
            <option ${lead.status==='Qualified' ? 'selected' : ''}>Qualified</option>
            <option ${lead.status==='Lost'      ? 'selected' : ''}>Lost</option>
          </select>
        </td>
        <td>${formatDate(lead.created_at)}</td>
        <td>
          <div class="actions">
            <button class="btn btn-score" onclick="openScorePanel(${lead.id})">Score</button>
            <button class="btn btn-draft" onclick="openEmailPanel(${lead.id})">Draft Email</button>
            <button class="btn btn-edit"  onclick="startEdit(${lead.id})">Edit</button>
            <button class="btn btn-danger" onclick="deleteLead(${lead.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  async function changeStatus(id, selectEl) {
    const newStatus = selectEl.value;
    selectEl.className = `status-select status-${newStatus}`;
    const lead = allLeads.find(l => l.id === id);
    if (!lead) return;
    lead.status = newStatus;
    await fetch(`/api/leads/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...lead, status: newStatus }),
    });
    updateStats();
    toast("Status changed to " + newStatus + ".");
  }

  function exportCSV() {
    window.location.href = "/api/leads/export";
  }

  function openModal(lead) {
    editingId = lead ? lead.id : null;
    const isEdit = !!lead;
    document.getElementById("modalTitle").textContent = isEdit ? "Edit Lead" : "Add New Lead";
    document.getElementById("submitBtn").textContent  = isEdit ? "Save Changes" : "Add Lead";
    document.getElementById("f-name").value   = lead ? (lead.name   || "") : "";
    document.getElementById("f-email").value  = lead ? (lead.email  || "") : "";
    document.getElementById("f-phone").value  = lead ? (lead.phone  || "") : "";
    document.getElementById("f-source").value = lead ? (lead.source || "") : "";
    document.getElementById("f-notes").value  = lead ? (lead.notes  || "") : "";
    document.getElementById("f-status").value = lead ? (lead.status || "New") : "New";
    document.getElementById("f-status").style.display   = isEdit ? "block" : "none";
    document.getElementById("statusLabel").style.display = isEdit ? "block" : "none";
    document.getElementById("modalBg").classList.add("open");
    document.getElementById("f-name").focus();
  }

  function closeModal() {
    document.getElementById("modalBg").classList.remove("open");
    document.getElementById("leadForm").reset();
    editingId = null;
  }

  document.getElementById("modalBg").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById("leadForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      name:   document.getElementById("f-name").value.trim(),
      email:  document.getElementById("f-email").value.trim(),
      phone:  document.getElementById("f-phone").value.trim(),
      source: document.getElementById("f-source").value.trim(),
      notes:  document.getElementById("f-notes").value.trim(),
      status: document.getElementById("f-status").value,
    };
    if (editingId) {
      await fetch(`/api/leads/${editingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      toast("Lead updated!");
    } else {
      await fetch("/api/leads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      toast("Lead added!");
    }
    closeModal();
    loadLeads();
  });

  function startEdit(id) {
    const lead = allLeads.find(l => l.id === id);
    if (lead) openModal(lead);
  }

  // ── Score panel ───────────────────────────────────────
  const scoreConfig = {
    Hot:  { icon: "🔥", cls: "score-hot"  },
    Warm: { icon: "☀️", cls: "score-warm" },
    Cold: { icon: "🧊", cls: "score-cold" },
  };

  async function openScorePanel(id) {
    document.getElementById("scorePanelBg").classList.add("open");
    document.getElementById("scoreGenerating").style.display = "block";
    document.getElementById("scoreResult").style.display     = "none";

    const res  = await fetch(`/api/leads/${id}/score`, { method: "POST" });
    const data = await res.json();

    document.getElementById("scoreGenerating").style.display = "none";
    document.getElementById("scoreResult").style.display     = "block";

    if (data.error) {
      document.getElementById("scoreIcon").textContent  = "⚠️";
      document.getElementById("scoreLabel").textContent = "Error";
      document.getElementById("scoreLabel").className   = "score-label";
      document.getElementById("scoreReason").textContent = data.error;
      return;
    }

    const cfg = scoreConfig[data.rating] || { icon: "❓", cls: "" };
    document.getElementById("scoreIcon").textContent  = cfg.icon;
    document.getElementById("scoreLabel").textContent = data.rating;
    document.getElementById("scoreLabel").className   = `score-label ${cfg.cls}`;
    document.getElementById("scoreReason").textContent = data.reason;
  }

  function closeScorePanel() {
    document.getElementById("scorePanelBg").classList.remove("open");
  }

  document.getElementById("scorePanelBg").addEventListener("click", function(e) {
    if (e.target === this) closeScorePanel();
  });

  let currentDraftLeadId = null;

  async function openEmailPanel(id) {
    currentDraftLeadId = id;
    const lead = allLeads.find(l => l.id === id);
    document.getElementById("emailSubtext").textContent =
      `AI-generated draft for ${lead ? lead.name : "this lead"} — edit before sending.`;
    document.getElementById("emailBox").value = "";
    document.getElementById("emailPanelBg").classList.add("open");
    await generateEmail(id);
  }

  function closeEmailPanel() {
    document.getElementById("emailPanelBg").classList.remove("open");
    currentDraftLeadId = null;
  }

  async function regenerateEmail() {
    if (currentDraftLeadId) await generateEmail(currentDraftLeadId);
  }

  async function generateEmail(id) {
    const box = document.getElementById("emailBox");
    const generating = document.getElementById("emailGenerating");
    box.style.display = "none";
    generating.style.display = "block";

    const res = await fetch(`/api/leads/${id}/draft-email`, { method: "POST" });
    const data = await res.json();

    generating.style.display = "none";
    box.style.display = "block";

    if (data.error) {
      box.value = "Error: " + data.error;
    } else {
      box.value = data.email;
    }
  }

  function copyEmail() {
    const box = document.getElementById("emailBox");
    navigator.clipboard.writeText(box.value).then(() => toast("Copied to clipboard!"));
  }

  document.getElementById("emailPanelBg").addEventListener("click", function(e) {
    if (e.target === this) closeEmailPanel();
  });

  function deleteLead(id) {
    if (pendingDelete) {
      clearTimeout(pendingDelete.timer);
      actuallyDelete(pendingDelete.id);
    }
    const lead = allLeads.find(l => l.id === id);
    allLeads = allLeads.filter(l => l.id !== id);
    updateStats();
    renderTable();
    const timer = setTimeout(() => {
      actuallyDelete(id);
      pendingDelete = null;
    }, 5000);
    pendingDelete = { id, lead, timer };
    toast("Lead deleted.", true);
  }

  async function actuallyDelete(id) {
    await fetch(`/api/leads/${id}`, { method: "DELETE" });
  }

  function undoDelete() {
    if (!pendingDelete) return;
    clearTimeout(pendingDelete.timer);
    allLeads.unshift(pendingDelete.lead);
    pendingDelete = null;
    updateStats();
    renderTable();
    toast("Delete undone!");
  }

  let toastTimer = null;
  function toast(msg, showUndo = false) {
    const el    = document.getElementById("toast");
    const msgEl = document.getElementById("toastMsg");
    const undoEl = document.getElementById("undoBtn");
    msgEl.textContent    = msg;
    undoEl.style.display = showUndo ? "inline-block" : "none";
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), showUndo ? 5000 : 2500);
  }

  function esc(str) {
    if (!str) return "";
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function formatDate(dt) {
    if (!dt) return "";
    return new Date(dt).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  }

  loadLeads();
</script>

</body>
</html>
